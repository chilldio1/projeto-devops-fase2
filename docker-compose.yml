services:
  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: banco
      DB_NAME: estudos
      DB_USER: diogo
      DB_PASSWORD: senha123
    depends_on:
      - banco

  banco:
    image: postgres:15
    environment:
      POSTGRES_USER: diogo
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: estudos
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  postgres-dados:
